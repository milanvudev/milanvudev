<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a9e">
        <animate attributeName="stop-color" values="#ff9a9e;#a18cd1;#84fab0;#fbc2eb;#ff9a9e" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#fad0c4">
        <animate attributeName="stop-color" values="#fad0c4;#fbc2eb;#8fd3f4;#ffecd2;#fad0c4" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fdbff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2a9df4" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8945f"/>
      <stop offset="100%" stop-color="#a06d3e"/>
    </linearGradient>
    <clipPath id="clipWater">
      <rect x="0" y="228" width="600" height="92"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="600" height="320" rx="24" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="90" cy="70" r="34" fill="#fff6a8">
    <animate attributeName="r" values="34;40;34" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="70" r="52" fill="#fff6a8" opacity="0.25">
    <animate attributeName="r" values="52;66;52" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="0" cy="60" rx="38" ry="15"/><ellipse cx="22" cy="52" rx="26" ry="15"/><ellipse cx="-22" cy="54" rx="22" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="-80,0;700,0" dur="38s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="105" rx="30" ry="12"/><ellipse cx="18" cy="98" rx="20" ry="12"/><ellipse cx="-18" cy="100" rx="18" ry="10"/>
      <animateTransform attributeName="transform" type="translate" values="-80,0;700,0" dur="55s" begin="-20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- hills -->
  <path d="M0 215 Q120 150 240 205 T480 190 T600 205 V240 H0 Z" fill="#7bd88f" opacity="0.9"/>
  <path d="M0 235 Q150 190 300 228 T600 220 V250 H0 Z" fill="#4cc38a"/>

  <!-- rainbow sparkles -->
  <g font-size="20">
    <text x="480" y="70" fill="#ffd700">✦<animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></text>
    <text x="540" y="120" fill="#ff5fa2">✦<animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="250" y="60" fill="#ffffff">✦<animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.8s" repeatCount="indefinite"/></text>
    <text x="170" y="120" fill="#7df9ff">✦<animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="1.1s" repeatCount="indefinite"/></text>
    <text x="400" y="40" fill="#c77dff">✦<animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0.2s" repeatCount="indefinite"/></text>
  </g>

  <!-- capybara (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="2.4s" repeatCount="indefinite"/>

    <!-- body -->
    <ellipse cx="290" cy="215" rx="125" ry="58" fill="url(#fur)"/>
    <!-- head -->
    <rect x="365" y="140" width="115" height="88" rx="38" fill="url(#fur)"/>
    <!-- snout -->
    <ellipse cx="470" cy="190" rx="22" ry="26" fill="#8a5a33"/>
    <ellipse cx="478" cy="178" rx="4" ry="6" fill="#2b1a0e"/>
    <path d="M440 208 Q458 218 474 206" stroke="#2b1a0e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- ear -->
    <ellipse cx="392" cy="140" rx="10" ry="13" fill="#8a5a33"/>
    <ellipse cx="392" cy="141" rx="5" ry="7" fill="#e7a98a"/>
    <!-- eye -->
    <ellipse cx="428" cy="170" rx="6" ry="7" fill="#1b1b1b">
      <animate attributeName="ry" values="7;7;0.8;7;7" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="430" cy="167" r="2" fill="#ffffff"/>
    <!-- blush -->
    <ellipse cx="418" cy="195" rx="10" ry="6" fill="#ff7aa8" opacity="0.6"/>

    <!-- yuzu on head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 420 128;6 420 128;-6 420 128" dur="2.4s" repeatCount="indefinite"/>
      <circle cx="420" cy="128" r="17" fill="#ffd23f"/>
      <circle cx="414" cy="122" r="5" fill="#fff2a0" opacity="0.7"/>
      <path d="M420 111 Q430 100 438 106 Q430 114 420 111 Z" fill="#3fbf6a"/>
    </g>

    <!-- tiny hearts -->
    <g fill="#ff4d8d" font-size="22">
      <text x="485" y="140">♥
        <animate attributeName="y" values="140;90" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="505" y="150" font-size="16">♥
        <animate attributeName="y" values="150;100" dur="3.6s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3.6s" begin="1s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- water -->
  <g clip-path="url(#clipWater)">
    <path fill="url(#water)">
      <animate attributeName="d" dur="3s" repeatCount="indefinite"
        values="M0 238 Q75 226 150 238 T300 238 T450 238 T600 238 V320 H0 Z;
                M0 238 Q75 250 150 238 T300 238 T450 238 T600 238 V320 H0 Z;
                M0 238 Q75 226 150 238 T300 238 T450 238 T600 238 V320 H0 Z"/>
    </path>
    <path fill="#ffffff" opacity="0.25">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="M0 250 Q75 242 150 250 T300 250 T450 250 T600 250 V320 H0 Z;
                M0 250 Q75 258 150 250 T300 250 T450 250 T600 250 V320 H0 Z;
                M0 250 Q75 242 150 250 T300 250 T450 250 T600 250 V320 H0 Z"/>
    </path>
  </g>

  <!-- steam / bubbles -->
  <g fill="#ffffff">
    <circle cx="140" cy="250" r="6" opacity="0.7">
      <animate attributeName="cy" values="260;190" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="255" r="4" opacity="0.7">
      <animate attributeName="cy" values="265;195" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="255" r="7" opacity="0.7">
      <animate attributeName="cy" values="265;185" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="260" r="5" opacity="0.7">
      <animate attributeName="cy" values="270;200" dur="3.8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.8s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- caption -->
  <text x="300" y="300" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
    Chill like a capybara 🌿
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
