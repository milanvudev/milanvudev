<svg viewBox="0 0 800 190" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43e97b"/><stop offset="1" stop-color="#38f9d7"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d365"/><stop offset="1" stop-color="#fda085"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4facfe"/><stop offset="1" stop-color="#00c6fb"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a95"/><stop offset="1" stop-color="#c471ed"/></linearGradient>
    <clipPath id="c"><rect width="185" height="150" rx="22"/></clipPath>
  </defs>

  <!-- card 1 -->
  <g transform="translate(10,20)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" repeatCount="indefinite"/>
      <rect width="185" height="150" rx="22" fill="url(#g1)"/>
      <g clip-path="url(#c)"><rect x="-60" y="-10" width="30" height="180" fill="#fff" opacity="0.25" transform="skewX(-20)">
        <animate attributeName="x" values="-60;260" dur="4s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(92.5,46)" fill="#fff">
        <path d="M-20 14 Q-22 -22 16 -24 Q18 14 -20 14 Z"/>
        <path d="M-22 18 L8 -10" stroke="#1e9e6a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <text x="92.5" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Siêu chill</text>
      <text x="92.5" y="128" text-anchor="middle" font-size="12" fill="#fff">Luôn bình thản</text>
    </g>
  </g>

  <!-- card 2 -->
  <g transform="translate(205,20)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <rect width="185" height="150" rx="22" fill="url(#g2)"/>
      <g clip-path="url(#c)"><rect x="-60" y="-10" width="30" height="180" fill="#fff" opacity="0.25" transform="skewX(-20)">
        <animate attributeName="x" values="-60;260" dur="4s" begin="1s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(92.5,44)">
        <circle cx="-12" cy="0" r="16" fill="#fff" opacity="0.9"/>
        <circle cx="12" cy="0" r="16" fill="#fff" opacity="0.7"/>
      </g>
      <text x="92.5" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Thân thiện</text>
      <text x="92.5" y="128" text-anchor="middle" font-size="12" fill="#fff">Bạn của mọi loài</text>
    </g>
  </g>

  <!-- card 3 -->
  <g transform="translate(400,20)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" begin="1s" repeatCount="indefinite"/>
      <rect width="185" height="150" rx="22" fill="url(#g3)"/>
      <g clip-path="url(#c)"><rect x="-60" y="-10" width="30" height="180" fill="#fff" opacity="0.25" transform="skewX(-20)">
        <animate attributeName="x" values="-60;260" dur="4s" begin="2s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(92.5,44)" fill="#fff">
        <path d="M0 -24 Q24 6 0 22 Q-24 6 0 -24 Z"/>
      </g>
      <text x="92.5" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Mê tắm nước</text>
      <text x="92.5" y="128" text-anchor="middle" font-size="12" fill="#fff">Ngâm mình là chân ái</text>
    </g>
  </g>

  <!-- card 4 -->
  <g transform="translate(595,20)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <rect width="185" height="150" rx="22" fill="url(#g4)"/>
      <g clip-path="url(#c)"><rect x="-60" y="-10" width="30" height="180" fill="#fff" opacity="0.25" transform="skewX(-20)">
        <animate attributeName="x" values="-60;260" dur="4s" begin="3s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(92.5,44)" fill="#fff">
        <path d="M0 20 C-32 -4 -16 -28 0 -10 C16 -28 32 -4 0 20 Z">
          <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="1.2s" repeatCount="indefinite"/>
        </path>
      </g>
      <text x="92.5" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Dễ thương</text>
      <text x="92.5" y="128" text-anchor="middle" font-size="12" fill="#fff">Nhìn là hết stress</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
