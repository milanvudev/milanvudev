<svg viewBox="0 0 220 210" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1a06a"/>
      <stop offset="100%" stop-color="#a87444"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="110" cy="198" rx="62" ry="7" fill="#000" opacity="0.12">
    <animate attributeName="rx" values="62;56;62" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="2.6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 110 195;2 110 195;-2 110 195" dur="5s" repeatCount="indefinite"/>

      <!-- feet -->
      <ellipse cx="72" cy="190" rx="19" ry="9" fill="#8a5a33"/>
      <ellipse cx="148" cy="190" rx="19" ry="9" fill="#8a5a33"/>

      <!-- body -->
      <ellipse cx="110" cy="148" rx="74" ry="46" fill="url(#fur)"/>

      <!-- head -->
      <rect x="58" y="38" width="104" height="86" rx="38" fill="url(#fur)"/>

      <!-- ears -->
      <ellipse cx="68" cy="50" rx="11" ry="13" fill="#8a5a33"/>
      <ellipse cx="68" cy="52" rx="5" ry="7" fill="#f2b8a0"/>
      <ellipse cx="152" cy="50" rx="11" ry="13" fill="#8a5a33"/>
      <ellipse cx="152" cy="52" rx="5" ry="7" fill="#f2b8a0"/>

      <!-- muzzle -->
      <ellipse cx="110" cy="103" rx="30" ry="19" fill="#9a6538"/>
      <ellipse cx="110" cy="94" rx="10" ry="6.5" fill="#2b1a0e"/>
      <ellipse cx="106" cy="92" rx="2.5" ry="1.6" fill="#ffffff" opacity="0.5"/>
      <path d="M99 108 Q110 118 121 108" stroke="#2b1a0e" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- eyes -->
      <ellipse cx="87" cy="76" rx="6" ry="7" fill="#1b1b1b">
        <animate attributeName="ry" values="7;7;0.8;7;7" keyTimes="0;0.86;0.9;0.94;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="133" cy="76" rx="6" ry="7" fill="#1b1b1b">
        <animate attributeName="ry" values="7;7;0.8;7;7" keyTimes="0;0.86;0.9;0.94;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="89" cy="73" r="2" fill="#fff"/>
      <circle cx="135" cy="73" r="2" fill="#fff"/>

      <!-- blush -->
      <ellipse cx="74" cy="98" rx="9" ry="5.5" fill="#ff7aa8" opacity="0.65"/>
      <ellipse cx="146" cy="98" rx="9" ry="5.5" fill="#ff7aa8" opacity="0.65"/>

      <!-- yuzu -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 110 36;6 110 36;-6 110 36" dur="2.6s" repeatCount="indefinite"/>
        <circle cx="110" cy="32" r="16" fill="#ffd23f"/>
        <circle cx="104" cy="26" r="5" fill="#fff2a0" opacity="0.75"/>
        <path d="M110 17 Q121 6 130 12 Q121 21 110 17 Z" fill="#3fbf6a"/>
      </g>
    </g>
  </g>

  <!-- hearts -->
  <g fill="#ff4d8d" font-family="Verdana, sans-serif">
    <text x="176" y="80" font-size="20">♥
      <animate attributeName="y" values="80;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="22" y="90" font-size="15" fill="#c77dff">♥
      <animate attributeName="y" values="90;40" dur="3.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="3.5s" begin="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- sparkles -->
  <g font-size="16" font-family="Verdana, sans-serif">
    <text x="190" y="140" fill="#ffd700">✦<animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></text>
    <text x="12" y="140" fill="#7df9ff">✦<animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.7s" repeatCount="indefinite"/></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
